[package]
name = "redbook-detector"
version = "1.0.0"
edition = "2021"
description = "小红书视频下载器"

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
regex = "1"
rfd = "0.14"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[profile.release]
strip = true
lto = true
opt-level = 3
